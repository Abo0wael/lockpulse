name: phase1

on:
  push:
  pull_request:

jobs:
  check-phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # zero-warnings policy: any compiler warning fails CI
      EXTRA_CFLAGS: -Werror
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-pandas

      - name: Record environment
        shell: bash
        run: |
          uname -a
          gcc --version | head -1
          ldd --version | head -1
          make --version | head -1
          python3 -c 'import sys, pandas; print(sys.version.split()[0], "pandas", pandas.__version__)'
          echo "yama ptrace_scope: $(cat /proc/sys/kernel/yama/ptrace_scope 2>/dev/null || echo n/a)"
          nproc

      - name: make clean && make check-phase1
        shell: bash   # bash -eo pipefail: the tee does not hide a failing gate
        run: |
          mkdir -p results
          make clean
          make check-phase1 2>&1 | tee results/check_phase1_ci.txt

      - name: Upload run data and gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-data-${{ github.run_number }}
          # Tier F .bin files are excluded on purpose (sparse 128 MiB each);
          # their CSV conversions in data/processed/tierF/ are uploaded instead.
          path: |
            data/raw/meta/
            data/raw/tierP/
            data/processed/
            results/
          if-no-files-found: warn
          retention-days: 14
