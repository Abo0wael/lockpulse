name: ci

on:
  push:
  pull_request:

# Pinned runner image (the "Image:" line in the Set up job log of the last green
# run) so every result comes from one OS image; actions are on their Node 24 majors.

jobs:
  phase1:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      EXTRA_CFLAGS: -Werror   # zero-warnings policy
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain (bounded, non-interactive)
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: bash .github/ci-install.sh build

      - name: Record environment
        shell: bash
        run: |
          echo "ImageOS=${ImageOS:-?} ImageVersion=${ImageVersion:-?}"
          uname -a
          gcc --version | head -1
          ldd --version | head -1
          make --version | head -1
          python3 -c 'import sys, pandas; print(sys.version.split()[0], "pandas", pandas.__version__)'
          echo "yama ptrace_scope: $(cat /proc/sys/kernel/yama/ptrace_scope 2>/dev/null || echo n/a)"
          nproc

      - name: make clean && make check-phase1
        shell: bash   # bash -eo pipefail: the tee does not hide a failing gate
        run: |
          mkdir -p results
          make clean
          make check-phase1 2>&1 | tee results/check_phase1_ci.txt

      - name: Upload run data and gate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase1-data-${{ github.run_number }}
          # Tier F .bin files are excluded on purpose (sparse, 256 MiB each);
          # their CSV conversions in data/processed/ are uploaded instead.
          path: |
            data/raw/gate/meta/
            data/raw/gate/tierP/
            data/processed/gate/
            results/
          if-no-files-found: warn
          retention-days: 14

  ml-tests:
    # Unit tests of the Python pipeline (labels, features, baselines, alert policy,
    # threshold rule) on synthetic fixtures; no data, no scikit-learn needed.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain (bounded, non-interactive)
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: bash .github/ci-install.sh python

      - name: make test-ml
        run: make test-ml

  phase2:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      EXTRA_CFLAGS: -Werror
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain (bounded, non-interactive)
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: bash .github/ci-install.sh build

      - name: Record environment
        shell: bash
        run: |
          echo "ImageOS=${ImageOS:-?} ImageVersion=${ImageVersion:-?}"
          uname -a
          gcc --version | head -1
          ldd --version | head -1
          python3 -c 'import sys, pandas; print(sys.version.split()[0], "pandas", pandas.__version__)'

      - name: glibc symbol versions of interposed functions
        shell: bash
        run: |
          LIBC=$(gcc -print-file-name=libc.so.6)
          if [ ! -f "$LIBC" ]; then
            LIBC=$(ldconfig -p | awk '/libc\.so\.6 .*x86-64/ {print $NF; exit}')
          fi
          echo "libc: $LIBC"
          objdump -T "$LIBC" | grep -E "pthread_cond|sem_(wait|post|timedwait|trywait)|pthread_barrier_wait"

      - name: make clean && make check-phase2
        shell: bash
        run: |
          mkdir -p results
          make clean
          make check-phase2 2>&1 | tee results/check_phase2_ci.txt

      - name: Upload run data and gate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase2-gate-${{ github.run_number }}
          path: |
            data/raw/gate/meta/
            data/raw/gate/tierP/
            data/processed/gate/
            results/
          if-no-files-found: warn
          retention-days: 14
